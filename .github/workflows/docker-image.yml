name: Build and Push Docker Image to Amazon ECR

on:
  push:
    branches:
      - production
      - dev
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      run: |
        # Define image name and tag
        IMAGE_NAME=todo-app
        TAG=${GITHUB_SHA}

        # Build the Docker image
        docker build -t $IMAGE_NAME:$TAG .

    - name: Log in to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1
      env:
        AWS_REGION: ${{ secrets.AWS_REGION }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: Tag Docker image
      env:
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        REPOSITORY_NAME: fastapi/todo-app
      run: |
        IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${REPOSITORY_NAME}"
        TAG="${GITHUB_SHA}"
        IMAGE_NAME=todo-app
    
        # Debugging: Print values of IMAGE_URI and TAG
        echo "IMAGE_URI=$IMAGE_URI"
        echo "TAG=$TAG"
        echo "IMAGE_NAME=$IMAGE_NAME"

        # Tag the image for ECR
        docker tag "$IMAGE_NAME:$TAG" "$IMAGE_URI:$TAG"

    - name: Push Docker image to Amazon ECR
      env:
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        REPOSITORY_NAME: fastapi/todo-app
      run: |
        IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${REPOSITORY_NAME}"
        TAG=${GITHUB_SHA}
        IMAGE_NAME=todo-app

        docker tag "$IMAGE_NAME:$TAG" "$IMAGE_URI:$TAG"

        # Push the image to ECR
        docker push "$IMAGE_URI:$TAG"

    - name: Logout from Amazon ECR
      run: docker logout $IMAGE_URI
